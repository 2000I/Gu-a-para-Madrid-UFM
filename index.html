pan></a></div><div class=\"card-details\"><p>617 07 39 25</p></div></article></div>"}, {"chapter": "Vida en Madrid", "title": "Conectate con la ciudad", "links": [{"label": "Citylife Madrid", "url": "https://www.citylifemadrid.com/"}, {"label": "Tarjeta de transporte público", "url": "https://tarjetatransportepublico.crtm.es/crtm-abonos/entrada_cita.aspx?AspxAutoDetectCookieSupport=1"}], "text": "<p>Las zonas recomendadas son: Chamartín, Pinar de Chamartín, Hortaleza, Barrio de Salamanca, Prosperidad, Chamberí, Justicia, Las letras, Arturo Soria, María de Molina entre otras.</p><p>En este website puedes encontrar información respecto: hospedaje, actividades extracurriculares, beneficios para estudiantes, viajes y más.</p><h3>Transporte</h3><p>Madrid es una ciudad donde el transporte público es seguro y eficiente. En este enlace puedes solicitar más información de las opciones de pago.</p>", "kind": "city", "heading": "Movete por Madrid.", "html": "<h3>Zonas recomendadas</h3><div class=\"zone-list\"><span>Chamartín</span><span>Pinar de Chamartín</span><span>Hortaleza</span><span>Barrio de Salamanca</span><span>Prosperidad</span><span>Chamberí</span><span>Justicia</span><span>Las Letras</span><span>Arturo Soria</span><span>María de Molina</span></div><section class=\"feature\"><h3>Descubrí la ciudad</h3><p>Información sobre hospedaje, actividades extracurriculares, beneficios para estudiantes, viajes y más.</p><a class=\"site-link\" href=\"https://www.citylifemadrid.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Explorar Citylife Madrid <span aria-hidden=\"true\"><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></a></section><section class=\"feature\"><h3>Transporte público</h3><p>Madrid cuenta con transporte público seguro y eficiente. Consultá las opciones de pago y solicitá información de la tarjeta de transporte.</p><a class=\"site-link\" href=\"https://tarjetatransportepublico.crtm.es/crtm-abonos/entrada_cita.aspx?AspxAutoDetectCookieSupport=1\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar transporte <span aria-hidden=\"true\"><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></a></section>"}, {"chapter": "Presupuesto", "title": "Organizá tu mes", "links": [], "text": "<h3>Presupuesto estimado mensual para vivir en Madrid</h3><p>Estas cantidades pueden variar dependiendo del presupuesto y necesidades de cada persona. El precio de alquiler está en base a piso compartido, pero hay opciones de residencias estudiantiles y habitaciones en piso compartido.</p><table><caption>Estimación mensual del documento original</caption><tbody><tr><th>Apartamento</th><td>€ 900.00</td></tr><tr><th>Servicios</th><td>€ 50.00</td></tr><tr><th>Limpieza</th><td>€ 20.00</td></tr><tr><th>Transporte urbano</th><td>€ 20.00</td></tr><tr><th>Teléfono</th><td>€ 20.00</td></tr><tr><th>Supermercado</th><td>€ 120.00</td></tr><tr><th>Seguro médico</th><td>€ 50.00</td></tr><tr><th>Gastos extra</th><td>€ 60.00</td></tr><tr><th>Total</th><td>€ 1,240.00</td></tr></tbody></table>", "kind": "budget", "heading": "Tu presupuesto mensual.", "html": "<div class=\"budget-total\"><span>ESTIMADO MENSUAL</span><strong>€ 1,240<span>.00</span></strong></div><table><caption>Estimación mensual del documento original</caption><tbody><tr><th>Apartamento</th><td>€ 900.00</td></tr><tr><th>Servicios</th><td>€ 50.00</td></tr><tr><th>Limpieza</th><td>€ 20.00</td></tr><tr><th>Transporte urbano</th><td>€ 20.00</td></tr><tr><th>Teléfono</th><td>€ 20.00</td></tr><tr><th>Supermercado</th><td>€ 120.00</td></tr><tr><th>Seguro médico</th><td>€ 50.00</td></tr><tr><th>Gastos extra</th><td>€ 60.00</td></tr></tbody></table><p class=\"fine-print\">Las cantidades varían según el presupuesto y las necesidades de cada persona. El alquiler está estimado para un piso compartido; también existen residencias estudiantiles y habitaciones en pisos compartidos.</p>"}, {"chapter": "Visado", "title": "Prepará tu llegada", "links": [], "text": "<p>La visa se solicita solo cuando la estadía es mayor a 3 meses, por ejemplo, si cursarás un semestre. La visa que se solicita es la de estudios y el trámite es personal.</p><p>Como mínimo, se recomienda empezar a tramitar la visa 2 meses antes de irse a Madrid.</p><p>Para solicitar la visa, son como mínimo 15 umas.</p><p>Puedes solicitar una carta a la universidad para respaldar la solicitud.</p><p>Al ser este un trámite que puede variar en cuanto al tiempo, la universidad refiere al estudiante al consulado español de la embajada de España en el respectivo país.</p><p>La papelería que se solicita para el trámite normalmente suele ser:</p><ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p>Se recomienda siempre consultar con la embajada, esta información puede variar dependiendo del país de origen del estudiante.</p>", "kind": "visa", "heading": "Prepará tu llegada.", "html": "<div class=\"fact\"><span class=\"fact-number\">+3</span><div><h3>Meses de estadía</h3><p>La guía indica solicitar visa de estudios cuando la estadía supera los 3 meses, por ejemplo, para un semestre. El trámite es personal.</p></div></div><div class=\"fact\"><span class=\"fact-number\">02</span><div><h3>Meses antes de viajar</h3><p>Como mínimo, se recomienda comenzar el trámite 2 meses antes de irse a Madrid.</p></div></div><section class=\"feature\"><h3>Prepará tu solicitud</h3><p>Para solicitar la visa, son como mínimo 15 umas. Podés solicitar una carta a la universidad para respaldar tu solicitud.</p><p>Los tiempos pueden variar. La universidad refiere al estudiante al consulado español de la embajada de España en su país.</p></section>"}, {"chapter": "Visado", "title": "Documentos para tu solicitud", "heading": "Tu documentación, lista.", "kind": "documents", "links": [], "text": "<ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p>Se recomienda siempre consultar con la embajada; esta información puede variar dependiendo del país de origen del estudiante.</p>", "html": "<p>La papelería que se solicita normalmente para el trámite:</p><ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p class=\"fine-print\">Consultá siempre con la embajada. La información puede variar según el país de origen del estudiante.</p>"}, {"chapter": "Seguro", "title": "Viajá con tranquilidad", "links": [{"label": "Sanitas", "url": "https://segurosanitasprecios.com/"}], "text": "<p>Es recomendable contar con seguro médico para cualquier emergencia. El seguro que recomendamos es el de Sanitas, y puedes encontrar mucha más información al respecto, incluyendo el precio en la página web.</p><p>Siempre el estudiante puede escoger el seguro de su preferencia.</p>", "kind": "insurance", "heading": "Viajá con tranquilidad.", "html": "<div class=\"large-word\">Sanitas<span><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></div><p class=\"lead\">Es recomendable contar con un seguro médico para cualquier emergencia.</p><p>El documento recomienda Sanitas. En su página podés consultar más información y precios.</p><a class=\"site-link\" href=\"https://segurosanitasprecios.com/\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar seguro <span aria-hidden=\"true\"><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></a><p class=\"fine-print\">Cada estudiante puede escoger el seguro de su preferencia.</p>"}, {"chapter": "Contacto", "title": "Estamos para acompañarte", "links": [{"label": "Contacto UFM Madrid", "url": "mailto:campusmadrid@ufm.edu"}], "text": "<p>UFM · Universidad Francisco Marroquín · Madrid</p><h3>Contacto</h3><p>campusmadrid@ufm.edu<br>Marcela González</p>", "kind": "contact", "heading": "Estamos para vos.", "html": "<div class=\"wordmark\" aria-label=\"Universidad Francisco Marroquín Madrid\"><strong>UFM<span>.</span></strong><span>UNIVERSIDAD<br>FRANCISCO MARROQUÍN</span><b>MADRID</b></div><div class=\"contact-person\"><span>TU CONTACTO</span><h3>Marcela González</h3><a href=\"mailto:campusmadrid@ufm.edu\">campusmadrid@ufm.edu <svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></a></div>"}]</script>

const PAGES = JSON.parse(document.getElementById('book-data').textContent);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
let current=0, reading=false, customCover=CONFIG.defaultCover, uploadedUrl='', singlePage=false, engine=null;
const pageElements=[];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeURL(s) { try { const u = new URL(s); return /^(https?:|mailto:)$/.test(u.protocol) ? u.href : '#'; } catch { return '#'; } }
function pageMarkup(index, clone = false) {
  const p = PAGES[index];
  const top = `<div class="page-top"><span>${escapeHTML(p.chapter.toUpperCase())}</span><span>UFM · MADRID</span></div>`;
  const bottom = `<div class="page-bottom"><span>GUÍA PARA MADRID</span><span>${pad(index + 1)}</span></div>`;
  if (p.cover) return top + `<div class="cover-layout"><h2 class="cover-title">Guía para <span>Madrid.</span></h2><div class="cover-space${customCover ? ' has-cover' : ''}">${customCover ? `<img class="cover-image" src="${escapeHTML(customCover)}" alt="${customCover===CONFIG.defaultCover ? 'Campus de UFM Madrid bajo la nieve. Fotografía de Arturo Fabra.' : 'Portada de Guía para Madrid'}">` : '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26"/><circle cx="11" cy="11" r="3"/><path d="m4 26 9-9 5 5 4-5 7 8"/></svg><strong>ESPACIO PARA TU PORTADA</strong>'}</div>${customCover===CONFIG.defaultCover ? '<a class="photo-credit" href="https://noticias.ufm.edu/2021/01/nieve-en-el-campus-de-madrid/" target="_blank" rel="noopener noreferrer">Campus UFM Madrid · Foto: Arturo Fabra / UFM</a>' : ''}<p class="cover-intro">En esta guía te compartimos información referente a hospedaje, transporte, seguro y visado.</p><button class="open-book" ${clone ? 'tabindex="-1"' : ''}>Abrir la guía <span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button></div>` + bottom;
  return top + `<section class="native-content kind-${escapeHTML(p.kind||'standard')}"><div class="section-kicker">${pad(index)} / ${escapeHTML(p.chapter)}</div><h2>${escapeHTML(p.heading||p.title)}</h2><div class="native-body">${p.html||p.text}</div></section>` + bottom;
}
function fillPage(el, index, clone = false) {
  const p = PAGES[index];
  el.className = 'page' + (p.cover ? ' cover' : '') + (!p.cover ? ' native-page' : '');
  el.innerHTML = pageMarkup(index, clone);
  if (!clone) el.querySelectorAll('.open-book,.cover-image-open').forEach(b => b.addEventListener('click', () => go(landscape()?2:1)));
}
function renderText() {
  const p = PAGES[current];
  $('textPage').innerHTML = `<span class="eyebrow">${escapeHTML(p.chapter)} · ${pad(current+1)}</span><h2>${escapeHTML(p.title)}</h2>${p.text}${p.links.length ? `<div class="text-links"><h3>Enlaces de esta página</h3>${p.links.map(l=>`<a href="${escapeHTML(safeURL(l.url))}" ${l.url.startsWith('mailto:')?'':'target="_blank" rel="noopener noreferrer"'}>${escapeHTML(l.label)} <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg><span class="sr-only">${l.url.startsWith('mailto:')?'':' (abre en otra pestaña)'}</span></a>`).join('')}</div>`:''}${p.cover?'<button class="open-book">Abrir la guía <span><svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>':''}`;
  $('textPage').querySelector('.open-book')?.addEventListener('click',()=>go(1));
  $('textPage').scrollTop = 0;
}
function landscape() { return !reading && engine?.getOrientation() === 'landscape'; }
function visiblePages() { return landscape() ? [current, current+1].filter(i=>i<PAGES.length) : [current]; }
function syncUI() {
  const visible=visiblePages();
  $('counter').textContent = `${visible.map(i=>pad(i+1)).join('–')} / ${pad(PAGES.length)}`;
  $('chapterLabel').textContent = visible.map(i=>PAGES[i].chapter).filter((v,i,a)=>a.indexOf(v)===i).join(' / ').toUpperCase();
  $('prev').disabled=current===0;
  $('next').disabled=visible[visible.length-1]>=PAGES.length-1;
  $('progress').value=current+1;
  document.querySelectorAll('#contents [data-page]').forEach(b=>{b.removeAttribute('aria-current');if(visible.includes(Number(b.dataset.page)))b.setAttribute('aria-current','page');});
  pageElements.forEach((el,i)=>{el.inert=!visible.includes(i);el.setAttribute('aria-hidden',String(!visible.includes(i)));});
  $('zoom').disabled=reading;
  if(reading)renderText();
}
function setLocation() {try{history.replaceState(null,'',`#pagina-${current+1}`);}catch{}}
function go(index,animate=true,writeHash=true) {
  index=Math.max(0,Math.min(PAGES.length-1,index));
  if(reading){current=index;syncUI();if(writeHash)setLocation();return;}
  if(!engine || engine.getState()==='flipping')return;
  if(!animate||reduceMotion.matches)engine.turnToPage(index);
  else engine.flip(index,'bottom');
}
function step(direction) {
  if(reading){go(current+direction,false);return;}
  if(engine.getState()==='flipping')return;
  try{
    if(reduceMotion.matches){if(direction>0)engine.turnToNextPage();else engine.turnToPrevPage();}
    else if(direction>0)engine.flipNext('bottom');else engine.flipPrev('bottom');
  }catch{}
}
function bookDimensions(width=innerWidth,forceSingle=singlePage) {
  const double=width>=1100&&!forceSingle;
  const available=Math.max(240,width-(width>=1100?64:28));
  const total=double?Math.min(1720,available):Math.min(width>=1100?1060:820,available);
  const pageWidth=Math.floor(total/(double?2:1));
  return {double,pageWidth,pageHeight:Math.round(pageWidth*(width<1100?1.50:1100/840)),total:pageWidth*(double?2:1)};
}
function resizeBook() {
  const d=bookDimensions();
  const area=$('stage').parentElement;
  area.style.width=`${d.total}px`;
  document.documentElement.style.setProperty('--book-w',`${d.pageWidth}px`);
  document.documentElement.style.setProperty('--spread-w',`${d.total}px`);
  if(engine){
    Object.assign(engine.getSettings(),{width:d.pageWidth,height:d.pageHeight,minWidth:d.pageWidth,maxWidth:d.pageWidth,minHeight:d.pageHeight,maxHeight:d.pageHeight});
    $('book').style.minWidth=`${d.pageWidth}px`;
    $('book').style.minHeight=`${d.pageHeight}px`;
    $('book').style.maxWidth=`${d.total}px`;
    engine.update();
    current=engine.getCurrentPageIndex();syncUI();
  }
}
function refreshCover() {
  pageElements[0].innerHTML=pageMarkup(0);
  pageElements[0].querySelector('.open-book')?.addEventListener('click',()=>go(landscape()?2:1));
}
function readHash(){const m=location.hash.match(/^#pagina-(\d+)$/);return m?Math.max(0,Math.min(PAGES.length-1,Number(m[1])-1)):0;}
function initBook(){
  resizeBook();
  const dims=bookDimensions();
  for(let i=0;i<PAGES.length;i++){
    const el=document.createElement('div');fillPage(el,i);el.dataset.density='soft';el.dataset.index=i;pageElements.push(el);$('book').append(el);
  }
  engine=new St.PageFlip($('book'),{
    width:dims.pageWidth,height:dims.pageHeight,size:'fixed',usePortrait:true,
    showCover:false,drawShadow:true,maxShadowOpacity:.30,flippingTime:1050,
    autoSize:true,showPageCorners:!reduceMotion.matches,disableFlipByClick:true,
    clickEventForward:true,mobileScrollSupport:true,swipeDistance:40,
    startPage:readHash(),useMouseEvents:!reduceMotion.matches
  });
  engine.on('flip',e=>{current=e.data;syncUI();setLocation();});
  engine.on('changeOrientation',()=>syncUI());
  engine.on('init',()=>{current=engine.getCurrentPageIndex();syncUI();});
  engine.loadFromHTML(pageElements);
  current=engine.getCurrentPageIndex();syncUI();
}
$('contents').innerHTML=PAGES.map((p,i)=>`<button data-page="${i}"><small>${pad(i+1)}</small><span>${escapeHTML(p.title)}</span></button>`).join('');
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{$('contentsDialog').close();go(Number(b.dataset.page),false);}));
$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
$('progress').max=PAGES.length;$('progress').addEventListener('input',e=>go(Number(e.target.value)-1,false));
$('contentsButton').addEventListener('click',()=>$('contentsDialog').showModal());
document.querySelectorAll('.close-dialog').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
$('layoutToggle').addEventListener('click',()=>{
  singlePage=!singlePage;$('layoutToggle').setAttribute('aria-pressed',String(singlePage));$('layoutToggle').textContent=singlePage?'Doble página':'Una página';resizeBook();
});
$('textMode').addEventListener('click',()=>{
  reading=!reading;$('textMode').setAttribute('aria-pressed',String(reading));$('stage').hidden=reading;$('textPage').hidden=!reading;
  if(!reading){resizeBook();engine.turnToPage(current);}syncUI();
});
$('zoom').addEventListener('click',()=>{
  const indices=visiblePages();$('zoomTitle').textContent=indices.map(i=>`${pad(i+1)} · ${PAGES[i].chapter}`).join(' / ');
  const wrapper=document.createElement('div');wrapper.className='zoom-spread';
  indices.forEach(i=>{const el=document.createElement('div');fillPage(el,i);wrapper.append(el);});
  $('zoomContent').replaceChildren(wrapper);$('zoomDialog').showModal();
});
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,6500);}
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Podés ampliar la guía con el botón de zoom.');}catch{toast('Podés ampliar la guía con el botón de zoom.');}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa');resizeBook();});
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  if(e.key==='Home'){e.preventDefault();go(0,false);}if(e.key==='End'){e.preventDefault();go(PAGES.length-1,false);}
});
addEventListener('hashchange',()=>go(readHash(),false,false));
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeBook,120);});
// La portada se previsualiza localmente; publicar exige subir portada.jpg al repositorio.
if(new URLSearchParams(location.search).get('editar')==='1'){
  $('editCover').hidden=false;$('editCover').addEventListener('click',()=>$('coverFile').click());
  $('coverFile').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Elegí una imagen JPG, PNG o WebP.');return;}
    if(file.size>20*1024*1024){toast('Elegí una imagen de menos de 20 MB.');return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{if(uploadedUrl)URL.revokeObjectURL(uploadedUrl);uploadedUrl=url;customCover=url;refreshCover();go(0,false);toast('Vista previa local. Para publicarla, subí la imagen como portada.jpg junto al HTML.');};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo abrir esa imagen. Probá con otra.');};img.src=url;
  });
}
initBook();
const cover=new Image();cover.onload=()=>{if(!uploadedUrl){customCover=CONFIG.coverUrl;refreshCover();}};cover.src=CONFIG.coverUrl;
</script>
</body>
</html>
