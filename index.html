una ciudad donde el transporte público es seguro y eficiente. En este enlace puedes solicitar más información de las opciones de pago.</p>", "kind": "city", "heading": "Movete por Madrid.", "html": "<h3>Zonas recomendadas</h3><div class=\"zone-list\"><span>Chamartín</span><span>Pinar de Chamartín</span><span>Hortaleza</span><span>Barrio de Salamanca</span><span>Prosperidad</span><span>Chamberí</span><span>Justicia</span><span>Las Letras</span><span>Arturo Soria</span><span>María de Molina</span></div><section class=\"feature\"><h3>Transporte público</h3><p>Madrid cuenta con transporte público seguro y eficiente. Consultá las opciones de pago y solicitá información de la tarjeta de transporte.</p><a class=\"site-link\" href=\"https://tarjetatransportepublico.crtm.es/crtm-abonos/entrada_cita.aspx?AspxAutoDetectCookieSupport=1\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar transporte <span aria-hidden=\"true\"><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></a></section>"}, {"chapter": "Presupuesto", "title": "Organizá tu mes", "links": [], "text": "<h3>Presupuesto estimado mensual para vivir en Madrid</h3><p class=\"fine-print\">Las cantidades varían según el presupuesto y las necesidades de cada persona. El alojamiento está estimado para un <strong>piso compartido</strong>; también existen residencias estudiantiles y habitaciones en pisos compartidos.</p><table><caption>Presupuesto mensual estimado</caption><tbody><tr><th>Alojamiento</th><td>€ 1,200.00</td></tr><tr><th>Servicios</th><td>€ 50.00</td></tr><tr><th>Limpieza</th><td>€ 20.00</td></tr><tr><th>Transporte urbano</th><td>€ 50.00</td></tr><tr><th>Teléfono</th><td>€ 20.00</td></tr><tr><th>Supermercado</th><td>€ 120.00</td></tr><tr><th>Seguro médico</th><td>€ 50.00</td></tr><tr><th>Gastos extra</th><td>€ 100.00</td></tr><tr><th>Total</th><td>€ 1,610.00</td></tr></tbody></table>", "kind": "budget", "heading": "Tu presupuesto mensual.", "html": "<div class=\"budget-total\"><span>ESTIMADO MENSUAL</span><strong>€ 1,610<span>.00</span></strong></div><table><caption>Presupuesto mensual estimado</caption><tbody><tr><th>Alojamiento</th><td>€ 1,200.00</td></tr><tr><th>Servicios</th><td>€ 50.00</td></tr><tr><th>Limpieza</th><td>€ 20.00</td></tr><tr><th>Transporte urbano</th><td>€ 50.00</td></tr><tr><th>Teléfono</th><td>€ 20.00</td></tr><tr><th>Supermercado</th><td>€ 120.00</td></tr><tr><th>Seguro médico</th><td>€ 50.00</td></tr><tr><th>Gastos extra</th><td>€ 100.00</td></tr></tbody></table><p class=\"fine-print\">Las cantidades varían según el presupuesto y las necesidades de cada persona. El alojamiento está estimado para un <strong>piso compartido</strong>; también existen residencias estudiantiles y habitaciones en pisos compartidos.</p>"}, {"chapter": "Visado", "title": "Prepará tu llegada", "links": [], "text": "<p>La visa se solicita solo cuando la estadía es mayor a 3 meses, por ejemplo, si cursarás un semestre. La visa que se solicita es la de estudios y el trámite es personal.</p><p>Se necesitan como mínimo 3 meses de anticipación para tramitar la visa antes de irse a Madrid.</p><p>Para solicitar la visa, son como mínimo 15 umas.</p><p>La universidad brindará 2 cartas para el trámite.</p><p>Al ser este un trámite que puede variar en cuanto al tiempo, la universidad refiere al estudiante al consulado español de la embajada de España en el respectivo país.</p><p>La papelería que se solicita para el trámite normalmente suele ser:</p><ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p>Se recomienda siempre consultar con la embajada, esta información puede variar dependiendo del país de origen del estudiante.</p>", "kind": "visa", "heading": "Prepará tu llegada.", "html": "<div class=\"fact\"><span class=\"fact-number\">+3</span><div><h3>Meses de estadía</h3><p>La guía indica solicitar visa de estudios cuando la estadía supera los 3 meses, por ejemplo, para un semestre. El trámite es personal.</p></div></div><div class=\"fact\"><span class=\"fact-number\">03</span><div><h3>Meses antes de viajar</h3><p>Se necesitan como mínimo <strong>3 meses de anticipación</strong> para tramitar la visa antes de viajar a Madrid.</p></div></div><section class=\"feature\"><h3>Prepará tu solicitud</h3><p>Para solicitar la visa, son como mínimo 15 umas. La universidad brindará <strong>2 cartas</strong> para el trámite.</p><p>Los tiempos pueden variar. La universidad refiere al estudiante al consulado español de la embajada de España en su país.</p></section>"}, {"chapter": "Visado", "title": "Documentos para tu solicitud", "heading": "Tu documentación, lista.", "kind": "documents", "links": [], "text": "<ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p>Se recomienda siempre consultar con la embajada; esta información puede variar dependiendo del país de origen del estudiante.</p>", "html": "<p>La papelería que se solicita normalmente para el trámite:</p><ul><li>Formulario oficial de solicitud</li><li>Pasaporte vigente</li><li>Fotografía reciente</li><li>Documentos que justifiquen la estadía (carta de admisión)</li><li>Comprobante de matrícula</li><li>Prueba de medios económicos</li><li>Seguro médico</li><li>Certificado médico</li><li>Prueba de alojamiento</li><li>Pago de la tasa consular</li><li>Documentos apostillados</li></ul><p class=\"fine-print\">Consultá siempre con la embajada. La información puede variar según el país de origen del estudiante.</p>"}, {"chapter": "Seguro", "title": "Viajá con tranquilidad", "links": [{"label": "Sanitas", "url": "https://www.sanitas.es/seguros/seguro-de-salud-sanitas-international-students"}], "text": "<p>Es recomendable contar con seguro médico para cualquier emergencia. El seguro que recomendamos es el de Sanitas, y puedes encontrar mucha más información al respecto, incluyendo el precio en la página web.</p><p>Siempre el estudiante puede escoger el seguro de su preferencia.</p>", "kind": "insurance", "heading": "Viajá con tranquilidad.", "html": "<div class=\"large-word\">Sanitas<span><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></div><p class=\"lead\">Es recomendable contar con un seguro médico para cualquier emergencia.</p><p>El documento recomienda Sanitas. En su página podés consultar más información y precios.</p><a class=\"site-link\" href=\"https://www.sanitas.es/seguros/seguro-de-salud-sanitas-international-students\" target=\"_blank\" rel=\"noopener noreferrer\">Consultar seguro <span aria-hidden=\"true\"><svg class=\"arrow-icon\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 18 18 6M6 6h12v12\"/></svg></span></a><p class=\"fine-print\">Cada estudiante puede escoger el seguro de su preferencia.</p>"}, {"chapter": "Contacto", "title": "Estamos para acompañarte", "links": [{"label": "Contacto UFM Madrid", "url": "mailto:campusmadrid@ufm.edu"}], "text": "<p>UFM · Universidad Francisco Marroquín · Madrid</p><h3>Contacto</h3><p>campusmadr const PAGES = JSON.parse(document.getElementById('book-data').textContent);
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
let current=0, reading=false, customCover=CONFIG.defaultCover, uploadedUrl='', singlePage=false, sizeFactor=1, engine=null;
const pageElements=[];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)');
function escapeHTML(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function safeURL(s) { try { const u = new URL(s); return /^(https?:|mailto:)$/.test(u.protocol) ? u.href : '#'; } catch { return '#'; } }
function pageMarkup(index, clone = false) {
  const p = PAGES[index];
  const top = `<div class="page-top"><span>${escapeHTML(p.chapter.toUpperCase())}</span><span>UFM · MADRID</span></div>`;
  const bottom = `<div class="page-bottom"><span>GUÍA PARA MADRID</span><span>${pad(index + 1)}</span></div>`;
  if (p.cover) return top + `<div class="cover-layout"><h2 class="cover-title">Guía para <span>Madrid.</span></h2><div class="cover-space${customCover ? ' has-cover' : ''}">${customCover ? `<img class="cover-image" src="${escapeHTML(customCover)}" alt="${customCover===CONFIG.defaultCover ? 'Gran Vía y el edificio Metrópolis en Madrid al atardecer. Foto de Florian Wehde.' : 'Portada de Guía para Madrid'}">` : '<svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="3" width="26" height="26"/><circle cx="11" cy="11" r="3"/><path d="m4 26 9-9 5 5 4-5 7 8"/></svg><strong>ESPACIO PARA TU PORTADA</strong>'}</div><p class="cover-intro">En esta guía te compartimos información referente a hospedaje, transporte, seguro y visado.</p><button class="open-book" ${clone ? 'tabindex="-1"' : ''}>Abrir la guía <span aria-hidden="true"><svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button></div>` + bottom;
  return top + `<section class="native-content kind-${escapeHTML(p.kind||'standard')}">${p.kind==='contact' ? '' : `<div class="section-kicker">${pad(index)} / ${escapeHTML(p.chapter)}</div><h2>${escapeHTML(p.heading||p.title)}</h2>`}<div class="native-body"><div class="body-flow">${p.html||p.text}</div></div></section>` + bottom;
}
// Los enlaces y botones no deben iniciar gestos de pasar hoja, aunque se toque su SVG.
function protectPageControls(root){
  root.querySelectorAll('a,button').forEach(control=>{
    for(const event of ['pointerdown','mousedown','touchstart','pointerup','mouseup','touchend','click']){
      control.addEventListener(event,e=>e.stopPropagation(),event.startsWith('touch')?{passive:true}:false);
    }
  });
  root.querySelectorAll('[data-copy-email]').forEach(button=>button.addEventListener('click',async()=>{
    const email=button.dataset.copyEmail;
    try{
      if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(email);
      else{
        const input=document.createElement('textarea');input.value=email;input.setAttribute('readonly','');
        input.style.cssText='position:fixed;left:-9999px;top:0';document.body.append(input);input.select();
        const copied=document.execCommand('copy');input.remove();if(!copied)throw new Error('copy');
      }
      toast('Correo copiado: '+email);
    }catch{toast('Copiá este correo: '+email);}
  }));
}
function fillPage(el, index, clone = false) {
  const p = PAGES[index];
  el.className = 'page' + (p.cover ? ' cover' : '') + (!p.cover ? ' native-page' : '') + (p.kind==='contact' ? ' contact-leaf' : '');
  el.innerHTML = pageMarkup(index, clone);
  if(!clone)protectPageControls(el);
  if (!clone) el.querySelectorAll('.open-book,.cover-image-open').forEach(b => b.addEventListener('click', () => go(1)));
}
function renderText() {
  const p = PAGES[current];
  $('textPage').innerHTML = `<span class="eyebrow">${escapeHTML(p.chapter)} · ${pad(current+1)}</span><h2>${escapeHTML(p.title)}</h2>${p.text}${p.links.length ? `<div class="text-links"><h3>Enlaces de esta página</h3>${p.links.map(l=>`<a href="${escapeHTML(safeURL(l.url))}" ${l.url.startsWith('mailto:')?'':'target="_blank" rel="noopener noreferrer"'}>${escapeHTML(l.label)} <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg><span class="sr-only">${l.url.startsWith('mailto:')?'':' (abre en otra pestaña)'}</span></a>`).join('')}</div>`:''}${p.cover?'<button class="open-book">Abrir la guía <span><svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 18 18 6M6 6h12v12"/></svg></span></button>':''}`;
  $('textPage').querySelector('.open-book')?.addEventListener('click',()=>go(1));
  $('textPage').scrollTop = 0;
}
function landscape() { return !reading && engine?.getOrientation() === 'landscape'; }
function visiblePages() { return landscape() && current>0 ? [current,current+1].filter(i=>i<PAGES.length) : [current]; }
function syncUI(state=engine?.getState()) {
  const visible=visiblePages();
  $('counter').textContent = `${visible.map(i=>pad(i+1)).join('–')} / ${pad(PAGES.length)}`;
  $('chapterLabel').textContent = visible.map(i=>PAGES[i].chapter).filter((v,i,a)=>a.indexOf(v)===i).join(' / ').toUpperCase();
  const turning=state==='flipping';
  $('prev').disabled=current===0||turning;
  $('next').disabled=visible[visible.length-1]>=PAGES.length-1||turning;
  $('book').classList.toggle('is-closed',landscape()&&current===0&&!turning);
  $('book').classList.toggle('is-back-cover',landscape()&&current===PAGES.length-1&&PAGES.length%2===0&&!turning);
  $('progress').value=current+1;
  document.querySelectorAll('#contents [data-page]').forEach(b=>{b.removeAttribute('aria-current');if(visible.includes(Number(b.dataset.page)))b.setAttribute('aria-current','page');});
  pageElements.forEach((el,i)=>{el.inert=!visible.includes(i);el.setAttribute('aria-hidden',String(!visible.includes(i)));});
  $('zoom').disabled=reading;
  if(reading)renderText();
  scheduleContentFit();
}
function setLocation() {try{history.replaceState(null,'',`#pagina-${current+1}`);}catch{}}
function go(index,animate=true,writeHash=true) {
  index=Math.max(0,Math.min(PAGES.length-1,index));
  if(reading){current=index;syncUI();if(writeHash)setLocation();return;}
  if(!engine || engine.getState()==='flipping')return;
  if(!animate||reduceMotion.matches)engine.turnToPage(index);
  else runAnimated(()=>engine.flip(index,'bottom'));
}
function step(direction) {
  if(reading){go(current+direction,false);return;}
  if(engine.getState()==='flipping')return;
  try{
    if(reduceMotion.matches){if(direction>0)engine.turnToNextPage();else engine.turnToPrevPage();}
    else runAnimated(()=>direction>0?engine.flipNext('bottom'):engine.flipPrev('bottom'));
  }catch{toast('No se pudo pasar la hoja. Volvé a intentarlo.');}
}
// El filtro de clics en esquinas no debe bloquear los botones programáticos.
function runAnimated(action){
  const settings=engine.getSettings(),restricted=settings.disableFlipByClick;
  settings.disableFlipByClick=false;
  try{action();}finally{settings.disableFlipByClick=restricted;}
}
let fittingQueued=false;
function scheduleContentFit(){
  if(fittingQueued)return;
  fittingQueued=true;
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    fittingQueued=false;
    if(reading)return;
    for(const i of visiblePages()){
      const body=pageElements[i]?.querySelector('.native-body');
      const flow=body?.querySelector('.body-flow');
      if(!body||!flow||body.clientHeight<=0)continue;
      flow.style.zoom='1';
      if(typeof CSS==='undefined'||!CSS.supports('zoom','1'))continue;
      const minimum=innerWidth<600?.94:.84;
      let scale=1;
      while(body.scrollHeight>body.clientHeight+1&&scale>minimum){
        scale=Math.max(minimum,Math.round((scale-.02)*100)/100);
        flow.style.zoom=String(scale);
      }
    }
  }));
}
function bookDimensions(width=innerWidth,forceSingle=singlePage,height=innerHeight,factor=sizeFactor) {
  const desktop=width>=1100;
  const double=desktop&&!forceSingle;
  const available=Math.max(240,width-(desktop?64:28));
  const ratio=desktop?1100/840:1.50;
  const widthLimit=(double?Math.min(1720,available)/2:Math.min(desktop?1060:820,available));
  const heightLimit=Math.max(260,height-170)/ratio;
  const base=desktop?Math.min(widthLimit,heightLimit):widthLimit;
  const pageWidth=Math.floor(Math.min(widthLimit,base*(desktop?factor:1)));
  return {double,pageWidth,pageHeight:Math.round(pageWidth*ratio),total:pageWidth*(double?2:1)};
}
function resizeBook() {
  const d=bookDimensions();
  $('fitSize').textContent=sizeFactor===1?'Ajustar':`${Math.round(sizeFactor*100)}%`;
  $('sizeDown').disabled=sizeFactor<=.6; $('sizeUp').disabled=sizeFactor>=1.6;
  const area=$('stage').parentElement;
  area.style.width=`${d.total}px`;
  document.documentElement.style.setProperty('--book-w',`${d.pageWidth}px`);
  document.documentElement.style.setProperty('--spread-w',`${d.total}px`);
  if(engine){
    Object.assign(engine.getSettings(),{width:d.pageWidth,height:d.pageHeight,minWidth:d.pageWidth,maxWidth:d.pageWidth,minHeight:d.pageHeight,maxHeight:d.pageHeight});
    $('book').style.minWidth=`${d.pageWidth}px`;
    $('book').style.minHeight=`${d.pageHeight}px`;
    $('book').style.maxWidth=`${d.total}px`;
    engine.update();
    current=engine.getCurrentPageIndex();syncUI();
  }
}
function refreshCover() {
  pageElements[0].innerHTML=pageMarkup(0);
  protectPageControls(pageElements[0]);
  pageElements[0].querySelector('.open-book')?.addEventListener('click',()=>go(1));
}
function readHash(){const m=location.hash.match(/^#pagina-(\d+)$/);return m?Math.max(0,Math.min(PAGES.length-1,Number(m[1])-1)):0;}
function initBook(){
  resizeBook();
  const dims=bookDimensions();
  for(let i=0;i<PAGES.length;i++){
    const el=document.createElement('div');fillPage(el,i);el.dataset.density='soft';el.dataset.index=i;pageElements.push(el);$('book').append(el);
  }
  engine=new St.PageFlip($('book'),{
    width:dims.pageWidth,height:dims.pageHeight,size:'fixed',usePortrait:true,
    showCover:true,drawShadow:true,maxShadowOpacity:.30,flippingTime:1050,
    autoSize:true,showPageCorners:!reduceMotion.matches,disableFlipByClick:true,
    clickEventForward:true,mobileScrollSupport:true,swipeDistance:40,
    startPage:readHash(),useMouseEvents:!reduceMotion.matches
  });
  engine.on('changeState',e=>{
    if(e.data==='flipping')$('book').classList.remove('is-closed','is-back-cover');
    if(e.data==='flipping'||e.data==='read')syncUI(e.data);
  });
  engine.on('flip',e=>{current=e.data;syncUI();setLocation();});
  engine.on('changeOrientation',()=>syncUI());
  engine.on('init',()=>{current=engine.getCurrentPageIndex();syncUI();});
  engine.loadFromHTML(pageElements);
  current=engine.getCurrentPageIndex();syncUI();
}
$('contents').innerHTML=PAGES.map((p,i)=>`<button data-page="${i}"><small>${pad(i+1)}</small><span>${escapeHTML(p.title)}</span></button>`).join('');
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{$('contentsDialog').close();go(Number(b.dataset.page),false);}));
$('prev').addEventListener('click',()=>step(-1));$('next').addEventListener('click',()=>step(1));
$('progress').max=PAGES.length;$('progress').addEventListener('input',e=>go(Number(e.target.value)-1,false));
$('contentsButton').addEventListener('click',()=>$('contentsDialog').showModal());
document.querySelectorAll('.close-dialog').forEach(b=>b.addEventListener('click',()=>b.closest('dialog').close()));
document.querySelectorAll('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d){const r=d.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)d.close();}}));
function changeSize(factor){sizeFactor=Math.max(.6,Math.min(1.6,Math.round(factor*10)/10));resizeBook();}
$('sizeDown').addEventListener('click',()=>changeSize(sizeFactor-.1));
$('sizeUp').addEventListener('click',()=>changeSize(sizeFactor+.1));
$('fitSize').addEventListener('click',()=>{changeSize(1);window.scrollTo({top:0,behavior:reduceMotion.matches?'instant':'smooth'});});
$('layoutToggle').addEventListener('click',()=>{
  singlePage=!singlePage;$('layoutToggle').setAttribute('aria-pressed',String(singlePage));$('layoutToggle').textContent=singlePage?'Doble página':'Una página';resizeBook();
});
$('textMode').addEventListener('click',()=>{
  reading=!reading;$('textMode').setAttribute('aria-pressed',String(reading));$('stage').hidden=reading;$('textPage').hidden=!reading;
  if(!reading){resizeBook();engine.turnToPage(current);}syncUI();
});
$('zoom').addEventListener('click',()=>{
  const indices=visiblePages();$('zoomTitle').textContent=indices.map(i=>`${pad(i+1)} · ${PAGES[i].chapter}`).join(' / ');
  const wrapper=document.createElement('div');wrapper.className='zoom-spread';
  indices.forEach(i=>{const el=document.createElement('div');fillPage(el,i);wrapper.append(el);});
  $('zoomContent').replaceChildren(wrapper);$('zoomDialog').showModal();
});
function toast(message){$('toast').textContent=message;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,6500);}
$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else toast('Podés ampliar la guía con el botón de zoom.');}catch{toast('Podés ampliar la guía con el botón de zoom.');}});
document.addEventListener('fullscreenchange',()=>{$('fullscreen').setAttribute('aria-label',document.fullscreenElement?'Salir de pantalla completa':'Pantalla completa');resizeBook();});
document.addEventListener('keydown',e=>{
  if(document.querySelector('dialog[open]')||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='ArrowRight'){e.preventDefault();step(1);}if(e.key==='ArrowLeft'){e.preventDefault();step(-1);}
  if(e.key==='Home'){e.preventDefault();go(0,false);}if(e.key==='End'){e.preventDefault();go(PAGES.length-1,false);}
});
addEventListener('hashchange',()=>go(readHash(),false,false));
let resizeTimer;addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resizeBook,120);});
// La portada se previsualiza localmente; publicar exige subir portada.jpg al repositorio.
if(new URLSearchParams(location.search).get('editar')==='1'){
  $('editCover').hidden=false;$('editCover').addEventListener('click',()=>$('coverFile').click());
  $('coverFile').addEventListener('change',e=>{
    const file=e.target.files[0];if(!file)return;
    if(!['image/jpeg','image/png','image/webp'].includes(file.type)){toast('Elegí una imagen JPG, PNG o WebP.');return;}
    if(file.size>20*1024*1024){toast('Elegí una imagen de menos de 20 MB.');return;}
    const url=URL.createObjectURL(file),img=new Image();
    img.onload=()=>{if(uploadedUrl)URL.revokeObjectURL(uploadedUrl);uploadedUrl=url;customCover=url;refreshCover();go(0,false);toast('Vista previa local. Para publicarla, subí la imagen como portada.jpg junto al HTML.');};
    img.onerror=()=>{URL.revokeObjectURL(url);toast('No se pudo abrir esa imagen. Probá con otra.');};img.src=url;
  });
}
initBook();
const cover=new Image();cover.onload=()=>{if(!uploadedUrl){customCover=CONFIG.coverUrl;refreshCover();}};cover.src=CONFIG.coverUrl;
</script>
</body>
</html>
